# Builds the Windows installer, the portable app and the command-line tool, and publishes them
# as a GitHub release, whenever a version tag such as v2.0.0 is pushed.
#
# To release: set the same version in Cargo.toml and src-tauri/tauri.conf.json,
# commit, then:  git tag v2.0.0  and  git push origin v2.0.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the version in the code
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          app_version=$(grep -m1 '"version"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Tag $tag, Cargo.toml $cargo_version, tauri.conf.json $app_version"
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$app_version" ]; then
            echo "::error::Tag v$tag doesn't match Cargo.toml ($cargo_version) and tauri.conf.json ($app_version)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test before building
        run: cargo test -p datefix-core -p datefix-cli

      - name: Build the installer
        run: npx --yes @tauri-apps/cli@2 build

      - name: Build the command-line tool
        run: cargo build --release -p datefix-cli

      - name: Collect the files to publish
        shell: bash
        run: |
          mkdir dist
          cp target/release/bundle/nsis/*.exe "dist/DateFix-${GITHUB_REF_NAME}-setup.exe"
          cp target/release/DateFix.exe "dist/DateFix-${GITHUB_REF_NAME}-portable.exe"
          cp target/release/datefix.exe "dist/datefix-cli-${GITHUB_REF_NAME}.exe"
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Download `DateFix-${{ github.ref_name }}-setup.exe`** and run it to install DateFix.

            - `DateFix-${{ github.ref_name }}-portable.exe`: the app without installing, just double-click it
            - `datefix-cli-${{ github.ref_name }}.exe`: the command-line version, no install needed

            DateFix keeps its undo history in a `DateFix data` folder next to the program, so everything stays in one place. Uninstalling removes it too.

            Windows may warn that the installer is from an unknown publisher, because it isn't code-signed. Click **More info → Run anyway**.
