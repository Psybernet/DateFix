# Runs the tests on Windows and Linux whenever code is pushed or a pull
# request is opened, and makes sure the desktop app still compiles on Windows.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests (core and command-line tool)
        run: cargo test -p datefix-core -p datefix-cli

      - name: Lint
        run: cargo clippy -p datefix-core -p datefix-cli -- -D warnings

      - name: Check the desktop app compiles
        if: runner.os == 'Windows'
        run: cargo clippy -p datefix-app -- -D warnings
