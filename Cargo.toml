[workspace]
resolver = "2"
members = ["crates/datefix-core", "crates/datefix-cli", "src-tauri"]

[workspace.package]
version = "2.1.1"
edition = "2021"
license = "MIT"
authors = ["Martin Heine"]
repository = "https://github.com/Psybernet/DateFix"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
